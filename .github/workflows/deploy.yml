# Deploys app/ to GitHub Pages and stamps the commit sha into the page (R6).
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build sha
        run: sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/g" app/index.html && grep -n "$GITHUB_SHA" app/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: pages
        uses: actions/deploy-pages@v4
